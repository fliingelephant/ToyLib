name = "ToyLib"
defaultTargets = ["ToyLib"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# The `@[trusted]` attribute, pinned by git so that a commit fixes the whole build.
[[require]]
name = "leanblame"
git = "https://github.com/fliingelephant/leanblame.git"
rev = "45d200b054349a9c3cb15a6fa0cadfb875102020"
subDir = "cli"

[[lean_lib]]
name = "ToyLib"
